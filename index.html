<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f2eb"><meta name="description" content="私人 AI 劇評日記，支援本機自動保存與圖片收藏。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><title>AI 劇評室</title>
<style>

:root{--bg:#f7f2eb;--paper:#fffdf9;--ink:#292720;--muted:#847d72;--line:#e8dfd3;--red:#9d594b;--rose:#ead5c9;--sage:#667b65}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}.app{max-width:1050px;margin:auto;padding:18px 15px 90px}.top,.brand,.nav,.row,.actions,.entry,.head{display:flex;align-items:center;gap:10px}.top,.head,.entry{justify-content:space-between}.brand{gap:11px}.logo{background:var(--red);color:white;border-radius:14px;width:42px;height:42px;display:grid;place-items:center;font-size:23px}h1{font-size:20px;margin:0}.muted,.tiny{font-size:12px;color:var(--muted)}.nav{background:#ece4d9;padding:4px;border-radius:13px}.nav button{border:0;background:none;color:var(--muted);padding:9px 12px;border-radius:10px}.nav button.active{background:white;color:var(--ink)}.page{display:none}.page.active{display:block}.hero{background:var(--rose);border-radius:22px;padding:22px;margin:20px 0 16px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:25px;top:-38px;font-size:130px;color:#fff8}.eyebrow{font-size:11px;letter-spacing:.14em;color:#86594d;font-weight:800}.hero h2{margin:5px 0;font-size:26px}.hero p{margin:0;color:#755e53;font-size:13px;max-width:450px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:15px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #50371c0a}.head{margin-bottom:14px}.head h3{font-size:16px;margin:0}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:750;color:#635d53;margin-bottom:6px}input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:11px;background:#fffefa;padding:11px 12px;color:var(--ink);outline:none}textarea{min-height:84px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#c78c79;box-shadow:0 0 0 3px #d9a18e30}.rating{display:grid;grid-template-columns:54px 1fr 31px;align-items:center;gap:7px;margin:14px 0}.rname{font-size:13px;font-weight:800}.scores{display:flex;gap:4px;flex-wrap:wrap}.score{border:1px solid var(--line);border-radius:8px;background:white;color:#777064;width:29px;height:31px;padding:0;font-size:11px}.score.sel{background:var(--red);border-color:var(--red);color:white;font-weight:800}.rval{text-align:right;color:var(--red);font-weight:850}.total{background:#f3eae0;border-radius:13px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.total strong{font-size:23px}.btn{border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink);font-weight:750;font-size:13px;padding:10px 13px}.btn.primary{background:var(--red);border-color:var(--red);color:white}.btn.soft{background:#f3e7df;color:#75483e}.actions{flex-wrap:wrap;margin-top:13px}.actions .btn{flex:1}.tip{padding:12px;background:#f5eee6;border-radius:12px;font-size:13px;margin:9px 0}.tag{display:inline-block;background:#e9eee6;color:#52684f;padding:4px 8px;border-radius:20px;font-size:11px}.entry{border:1px solid var(--line);border-radius:13px;padding:12px;margin:9px 0;gap:8px}.entryname{font-size:14px;font-weight:800;overflow-wrap:anywhere}.entrymeta{font-size:11px;color:var(--muted);margin-top:3px}.entryscore{font-size:18px;color:var(--red);font-weight:850;white-space:nowrap}.mini{border:0;border-radius:7px;padding:5px 8px;background:#f0e9df;font-size:11px;margin:5px 4px 0 0}.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:14px}.stat span{font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:23px;margin-top:5px}.bar{height:9px;background:#eee6dc;border-radius
:20px;overflow:hidden;flex:1}.fill{height:100%;background:#d4a18e;border-radius:20px}.barline{display:flex;align-items:center;gap:10px;margin:13px 0;font-size:12px}.preview{background:#f4ece3;padding:17px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin:13px 0}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#292720;color:white;padding:10px 15px;border-radius:11px;opacity:0;pointer-events:none}.toast.show{opacity:1}.bottom{display:none}.save-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:6px 9px;border-radius:9px;background:#f5eee6}.save-dot{width:7px;height:7px;border-radius:50%;background:#b9a98f;display:inline-block}.save-dot.ok{background:#668b64}.save-dot.err{background:#b84b3f}.image-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:10px}.image-card{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#f5eee6}.image-card img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}.image-card button{width:100%;border:0;background:#fffaf4;padding:7px 4px;font-size:11px;color:#7e453b}.image-card input{border:0;border-top:1px solid var(--line);border-radius:0;padding:7px;font-size:11px}.image-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.storage-box{background:#f5eee6;border-radius:12px;padding:12px;margin-top:10px;font-size:12px;color:var(--muted)}.install-btn{display:none}.backup-alert{border-left:3px solid #c58a72;padding:9px 11px;background:#f8eee8;border-radius:0 9px 9px 0;font-size:12px;margin-top:10px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px}
@media(max-width:720px){.app{padding:12px 11px 90px}.top{align-items:flex-start;flex-wrap:wrap}.brand{flex:1}.nav{width:100%;order:2}.nav button{flex:1;padding:9px 3px;font-size:12px}.hero{padding:18px;border-radius:18px}.hero h2{font-size:23px}.hero:after{right:5px;font-size:95px}.layout{grid-template-columns:1fr;gap:0}.panel{padding:15px}.rating{grid-template-columns:51px 1fr 27px;gap:5px}.score{width:27px;height:30px;font-size:10px}.statgrid{gap:7px}.stat{padding:10px}.stat strong{font-size:20px}body.on-write:not(.kb) .bottom{display:flex}.bottom{position:fixed;bottom:0;left:0;right:0;padding:9px 11px calc(9px + env(safe-area-inset-bottom));background:#fffdf9f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);gap:8px;z-index:4}.bottom .btn{flex:1}.hero:after{opacity:.6}}

/* ===== v2 新增樣式 ===== */
input,textarea,select{font-size:16px}
input[type=checkbox]{width:auto}
textarea{min-height:120px;resize:none;overflow:hidden;line-height:1.6}
.toast{z-index:60}
/* 評分 */
.rate{margin:0 0 18px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.rate:last-of-type{border-bottom:0}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.rname{font-size:14px;font-weight:800}
.rval{color:var(--red);font-weight:850;font-size:20px}
.bigs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.big{border:1px solid var(--line);border-radius:11px;background:white;color:#6d675c;height:46px;font-size:18px;font-weight:700;padding:0}
.big.sel{background:var(--red);border-color:var(--red);color:white}
.fine{display:flex;gap:6px;align-items:center;margin-top:8px}
.fine .step{flex:none;width:64px;height:40px;border:1px solid var(--line);border-radius:10px;background:#f3e7df;color:#75483e;font-weight:800;font-size:13px;padding:0}
.fine select{flex:1;height:40px;padding:0 10px;text-align:center;text-align-last:center}
.fine .tiny{flex:none}
/* 輸入輔助 */
.hint{font-size:12px;color:#75483e;background:#f8eee8;border-radius:9px;padding:7px 10px;margin-top:7px}
.hint:empty{display:none}
#kbBtn{position:fixed;right:12px;top:0;display:none;z-index:40;border:0;border-radius:20px;background:#292720;color:white;font-size:14px;font-weight:700;padding:9px 16px;box-shadow:0 4px 14px #0004}
/* 收藏列表 */
